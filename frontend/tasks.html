<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks | TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="app-container">
    <div id="appSidebar"></div>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px">
                <button class="mobile-toggle" id="mobileToggle" aria-label="Open navigation">☰</button>
                <div>
                    <h1 class="page-title">All Tasks</h1>
                    <p class="page-subtitle">Organize and manage your work.</p>
                </div>
            </div>
            <button class="primary-btn" onclick="openTaskModal()">+ Add New Task</button>
        </header>

        <section class="stat-grid">
            <div class="stat-card"><div class="stat-value" id="totalTasks">0</div><div class="stat-label">Total Tasks</div></div>
            <div class="stat-card"><div class="stat-value" id="pendingTasks">0</div><div class="stat-label">Pending</div></div>
            <div class="stat-card"><div class="stat-value" id="progressTasks">0</div><div class="stat-label">In Progress</div></div>
            <div class="stat-card"><div class="stat-value" id="completedTasks">0</div><div class="stat-label">Completed</div></div>
        </section>

        <section class="card" style="margin-top:24px">
            <div class="section-heading">
                <div>
                    <h2>Your Tasks</h2>
                    <p class="page-subtitle">Keep track of everything you need to accomplish.</p>
                </div>
                <span class="status completed" id="taskCount">0 Tasks</span>
            </div>

            <div class="task-toolbar">
                <div class="search-box">
                    <span class="search-symbol">⌕</span>
                    <input type="search" id="taskSearch" placeholder="Search tasks by title..." aria-label="Search tasks by title">
                </div>
                <select class="filter-select" id="statusFilter" aria-label="Filter by status">
                    <option value="">All Status</option>
                    <option>Pending</option><option>In Progress</option><option>Completed</option>
                </select>
                <select class="filter-select" id="priorityFilter" aria-label="Filter by priority">
                    <option value="">All Priorities</option>
                    <option>High</option><option>Medium</option><option>Low</option>
                </select>
            </div>

            <div class="task-table-wrapper">
                <table class="task-table">
                    <thead>
                        <tr><th>Task</th><th>Status</th><th>Priority</th><th>Due Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
                <div id="emptyState" class="task-empty" style="display:none">No tasks match your search.</div>
            </div>
            <div class="pagination-footer">
                <span id="showingTasks" class="pagination-info">
                    Showing 0 of 0 tasks
                </span>

                <div class="pagination-controls">
                    <label for="pageSize">Rows per page</label>
                    <select id="pageSize" class="filter-select">
                        <option value="5" selected>5</option>
                        <option value="10">10</option>
                    </select>

                    <button type="button" id="prevPage"
                            class="pagination-btn" disabled>
                        Previous
                    </button>

                    <div id="pageNumbers" class="page-numbers"></div>

                    <button type="button" id="nextPage"
                            class="pagination-btn" disabled>
                        Next
                    </button>
                </div>
            </div>
        </section>
    </main>
</div>

<div class="modal-overlay" id="taskModal">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modalTitle">Create New Task</h2>
            <button class="modal-close" onclick="closeTaskModal()" aria-label="Close modal">×</button>
        </div>
        <form id="taskForm">
            <input type="hidden" name="id">
            <div class="form-group">
                <label class="form-label">Task Title</label>
                <input class="form-input" type="text" name="title" maxlength="200" placeholder="Enter task title" required>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" name="description" rows="3" placeholder="Describe your task"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Status</label>
                <select class="form-input" name="status"><option>Pending</option><option>In Progress</option><option>Completed</option></select>
            </div>
            <div class="form-group">
                <label class="form-label">Priority</label>
                <select class="form-input" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
            </div>
            <div class="form-group">
                <label class="form-label">Due Date</label>
                <input class="form-input" type="date" name="due_date">
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary-btn" onclick="closeTaskModal()">Cancel</button>
                <button type="submit" class="primary-btn">Save Task</button>
            </div>
        </form>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
